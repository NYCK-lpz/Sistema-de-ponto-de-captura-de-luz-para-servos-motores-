
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPL Project | Monitoramento Inteligente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="container">

        <!-- ÁREA DA CÂMERA -->
        <section id="cameraBox">

            <img
                id="stream"
                src="/video_feed"
                alt="Câmera SPL Project"
            >

            <canvas
                id="overlay"
                width="320"
                height="240">
            </canvas>

        </section>

        <!-- PAINEL DE MONITORAMENTO -->
        <section id="painel">

            <h2>SPL Project</h2>

            <p id="conexao">Conectando ao sistema...</p>

            <div id="info">

                <p>Status: <span id="status">Aguardando</span></p>

                <p>Posição X: <span id="posX">0</span></p>

                <p>Posição Y: <span id="posY">0</span></p>

                <p>Erro X: <span id="erroX">0</span></p>

                <p>Ângulo do servo: <span id="angulo">90°</span></p>

                <p>LED ativo: <span id="led">Nenhum</span></p>

                <p>Detecção: <span id="deteccao">Aguardando</span></p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
